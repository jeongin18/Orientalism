<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오리엔탈리즘 방탈출: 시선의 미술관</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0c; --panel:#151517; --panel2:#1d1d21; --line:#2c2c33;
  --y:#f5c518; --y2:#ffd84d; --ydim:#6b5a17; --w:#f4f4f2; --mute:#a6a6ad;
  --ok:#57d18b; --bad:#ff6b6b; --blue:#7cc4ff;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--w);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;line-height:1.65;-webkit-text-size-adjust:100%}
body{min-height:100vh}
button{font:inherit;cursor:pointer;touch-action:manipulation}
a{color:var(--y)}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 80px}
.top{position:sticky;top:0;z-index:20;background:rgba(11,11,12,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:"Nanum Myeongjo",serif;font-weight:800;color:var(--y);font-size:18px;letter-spacing:-.3px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--mute);background:var(--panel)}
.keys{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.key{font-size:12px;padding:3px 9px;border-radius:999px;border:1px dashed var(--ydim);color:var(--ydim)}
.key.on{border-style:solid;border-color:var(--y);color:#111;background:var(--y);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;border:1px solid var(--y);background:var(--y);color:#111;font-weight:800;min-height:46px}
.btn:hover{background:var(--y2)}
.btn.ghost{background:transparent;color:var(--y)}
.btn.ghost:hover{background:rgba(245,197,24,.1)}
.btn.small{padding:7px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.35;cursor:not-allowed}
h1,h2,h3{line-height:1.3;letter-spacing:-.4px}
h1{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:clamp(28px,5vw,44px);margin:.2em 0 .3em}
h2{font-size:22px;margin:1.6em 0 .6em}
h3{font-size:18px;margin:1.2em 0 .5em}
.y{color:var(--y)} .mute{color:var(--mute)} .small{font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel+.panel{margin-top:14px}
.hero{padding:28px 0 8px}
.lead{font-size:18px;color:#ddd}
input[type=text],textarea{width:100%;background:#0f0f11;border:1px solid var(--line);border-radius:12px;color:var(--w);padding:12px 14px;font:inherit;font-size:16px}
input[type=text]:focus,textarea:focus{outline:2px solid var(--y);border-color:transparent}
textarea{min-height:140px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.door{position:relative;text-align:left;background:linear-gradient(180deg,#1b1b1f,#121214);border:1px solid var(--line);border-radius:var(--r);padding:18px;color:var(--w);min-height:170px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.door:hover:not(:disabled){transform:translateY(-2px);border-color:var(--y)}
.door .no{font-family:"Nanum Myeongjo",serif;color:var(--y);font-size:14px;letter-spacing:2px}
.door .t{font-size:20px;font-weight:800}
.door .d{color:var(--mute);font-size:14px}
.door .st{margin-top:auto;font-size:13px;font-weight:700}
.door:disabled{opacity:.45;cursor:not-allowed}
.door.done{border-color:var(--ydim)}
.door .lock{position:absolute;right:14px;top:12px;font-size:22px}
.story{border-left:3px solid var(--y);padding:6px 0 6px 14px;color:#e6e6e6;font-size:17px}
.src{background:#101012;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.src .hd{padding:12px 16px;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.src .hd b{color:var(--y)}
.src .bd{padding:14px 16px}
.orig{font-family:Georgia,"Times New Roman",serif;color:#cfcfcf;font-size:15px;border-left:2px solid #444;padding-left:12px;margin:0 0 10px}
.tr{font-size:16.5px}
.tr mark{background:transparent;color:var(--w);border-bottom:2px dashed var(--y);cursor:pointer;padding:0 1px}
.tr mark.found{background:rgba(245,197,24,.18);border-bottom-style:solid}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:#26262c;color:var(--mute);margin-right:4px}
.cite{font-size:13px;color:var(--mute);margin-top:10px}
.cite a{color:var(--blue);word-break:break-all}
.sourcing{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:10px 0}
.sourcing div{background:var(--panel2);border-radius:10px;padding:10px 12px;font-size:14px}
.sourcing div span{display:block;color:var(--y);font-weight:700;font-size:12px;letter-spacing:1px}
.figure{position:relative;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--line)}
.figure img{display:block;width:100%;height:auto}
.figure .ph{aspect-ratio:229/180;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--mute);background:repeating-linear-gradient(45deg,#121214,#121214 12px,#17171a 12px,#17171a 24px);text-align:center;padding:20px}
.hot{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:2px solid var(--y);background:rgba(0,0,0,.55);color:var(--y);font-weight:900;display:flex;align-items:center;justify-content:center;animation:pulse 1.8s infinite}
.hot.found{background:var(--y);color:#111;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,197,24,.6)}70%{box-shadow:0 0 0 14px rgba(245,197,24,0)}100%{box-shadow:0 0 0 0 rgba(245,197,24,0)}}
.clue{background:#141416;border:1px solid var(--ydim);border-radius:12px;padding:12px 14px;margin-top:10px}
.clue b{color:var(--y)}
.progress{height:8px;background:#222;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:var(--y);transition:width .3s}
.step{display:flex;gap:12px;align-items:flex-start;margin:22px 0 10px}
.step .n{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--y);color:#111;font-weight:900;display:flex;align-items:center;justify-content:center}
.step .n.off{background:#2a2a2f;color:var(--mute)}
.step h3{margin:2px 0}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--w);padding:12px 14px;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--y)}
.opt.ok{border-color:var(--ok);background:rgba(87,209,139,.12)}
.opt.no{border-color:var(--bad);background:rgba(255,107,107,.1)}
.fb{margin-top:10px;padding:12px 14px;border-radius:12px;font-size:15px}
.fb.ok{background:rgba(87,209,139,.1);border:1px solid rgba(87,209,139,.4)}
.fb.no{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.4)}
.fb.info{background:rgba(124,196,255,.08);border:1px solid rgba(124,196,255,.35)}
.sort .pool,.sort .bin{min-height:56px;border:1px dashed #3a3a42;border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.sort .bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.sort .bin{flex-direction:column;align-items:stretch;cursor:pointer;background:#111113}
.sort .bin.target{border-color:var(--y);background:rgba(245,197,24,.06)}
.sort .bin h4{margin:0 0 4px;font-size:14px;color:var(--y)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14.5px;color:var(--w);text-align:left}
.card.sel{border-color:var(--y);box-shadow:0 0 0 2px rgba(245,197,24,.35)}
.card.placed{border-color:var(--ydim);cursor:default}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.example{background:#121a12;border:1px solid #2f4a35;border-radius:12px;padding:14px 16px;margin-top:12px}
.example b{color:var(--ok)}
.count{font-size:13px;color:var(--mute);text-align:right}
.unlock{text-align:center;padding:26px 16px;border:1px solid var(--y);border-radius:var(--r);background:radial-gradient(circle at 50% 0,rgba(245,197,24,.18),transparent 70%);margin-top:26px}
.unlock .big{font-size:44px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all;background:#0f0f11;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:160px;overflow:auto;user-select:all}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--y);font-weight:700;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.foot{margin-top:40px;color:#666;font-size:13px;text-align:center}
.foot button{background:none;border:none;color:#777;text-decoration:underline}
.gl dt{color:var(--y);font-weight:800;margin-top:12px}
.gl dd{margin:4px 0 0 0;color:#ddd}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--y);color:#111;font-weight:800;padding:10px 18px;border-radius:999px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.hide{display:none!important}
</style>
</head>
<body>
<div class="top"><div class="in">
  <span class="brand" id="brand">시선의 미술관</span>
  <span class="chip" id="whoChip" style="display:none"></span>
  <div class="keys" id="keys"></div>
</div></div>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>

    sourcing:[

      ["어떻게","모로코로 가는 프랑스 외교 사절단(모르네 백작)에 동행. 돌아오는 길에 알제에서 한 튀르크계 인사 집의 여성 거처를 잠시 방문해 스케치"],
      ["맥락","프랑스는 1830년 알제를 점령했다. 그림은 정복 직후의 알제를 그린 것이다."]

  hotspots:[
    {x:9,y:60,label:"왼쪽 여인",title:"단서 1 · 이쪽을 보는 여인",
     text:"왼쪽에 기댄 여인은 그림 밖, 곧 <b>관람자</b> 쪽을 향해 있다. 그런데 1834년 파리 살롱에서 이 그림을 본 사람들은 실제로 이런 방에 들어갈 수 없는 프랑스인들이었다. 이 그림은 <b>들어갈 수 없는 공간을 ‘엿보는’ 경험</b>을 판다."},
    {x:62,y:86,label:"물담배",title:"단서 2 · 물담배와 나른한 자세",
     text:"바닥의 물담배와 쿠션에 기댄 몸짓은 <b>시간이 멈춘 듯한 나른함</b>을 만든다. 유럽 회화에서 ‘동양’은 자주 게으르고 관능적인 곳으로 그려졌다. 이것은 관찰일까, 기대일까?"},
    {x:86,y:30,label:"하녀",title:"단서 3 · 등을 돌린 하녀",
     text:"오른쪽의 흑인 하녀는 등을 반쯤 돌린 채 커튼 쪽으로 손을 들고 있고, 얼굴은 옆모습만 보인다. 그림 속 인물들은 <b>말하지 않는다</b>. 이들이 무엇을 생각하고 어떤 삶을 살았는지는 그림이 알려 주지 않는다."},
    {x:19,y:10,label:"장식",title:"단서 4 · 반짝이는 타일과 직물",
     text:"왼쪽 위의 금테 거울, 벽을 덮은 타일, 화려한 직물이 화면을 채운다. 들라크루아는 짧게 방문하며 많은 스케치를 남겼지만, 작품은 2년 뒤 <b>파리의 작업실</b>에서 완성했다. 기록과 <b>‘이국적인 분위기’ 연출</b> 사이의 거리를 생각해 보자."}
  ],
  after:"<b>또 다른 목소리.</b> 알제리 작가 아시아 제바르는 1980년에 이 그림과 같은 제목의 소설집 『알제의 여인들』을 냈다. 그는 들라크루아의 그림을 <b>‘훔친 시선(regard volé)’</b>이라고 불렀다. 그림 속 여인들이 직접 말하게 하려는 시도였다.",
  afterCites:[["CiNii: Djebar의 ‘regard volé’ 관련 논문 초록","https://cir.nii.ac.jp/crid/1050564288251910144"],["Goodreads: Femmes d'Alger dans leur appartement (1980) 책 소개","https://www.goodreads.com/book/show/1408291"]],
  quiz:{
    q:"이 그림을 ‘오리엔탈리즘’의 사례로 읽을 수 있는 가장 적절한 근거는?",
    opts:[
      "들라크루아가 북아프리카에 한 번도 가 보지 않고 상상으로만 그렸기 때문이다.",
      "유럽 관람자가 닫힌 ‘동양’의 내밀한 공간을 엿보는 구도이고, 그곳을 나른하고 이국적인 곳으로 보여 주며, 그려진 사람들은 말하지 않기 때문이다.",
      "그림에 쓰인 색이 지나치게 화려해서 사실과 다르기 때문이다.",
      "프랑스 화가가 그린 그림은 모두 오리엔탈리즘이기 때문이다."
    ],
    a:1,
    hint:"그는 실제로 알제에 갔다(1번은 사실이 아니다). 문제는 ‘누가 보고, 누가 보여지며, 누가 말하는가’이다.",
    explain:"사이드가 말한 오리엔탈리즘은 그림이 사실인지 아닌지보다 <b>보는 쪽(유럽)과 보여지는 쪽(동양)의 관계</b>를 묻는다. 들라크루아는 실제로 알제를 방문했다. 그래도 그림은 유럽 관람자의 기대에 맞춘 ‘동양’을 보여 주고, 그려진 이들의 목소리는 빠져 있다."
  }

  story:"두 번째 방은 낡은 서재다. 책상 위에 펼쳐진 두꺼운 책 한 권이 있다. 쪽지에는 이렇게 적혀 있다. <b>“이 글을 쓴 사람이 어떤 자리에 있었는지 밝혀라. 그리고 글 속의 ‘두 종류의 인간’을 나눠 보아라.”</b>",
  source:{
    title:"크로머 백작(이블린 베어링), 『현대 이집트(Modern Egypt)』 제2권 제34장, 1908",
    tags:["퍼블릭 도메인","사이드가 『오리엔탈리즘』에서 직접 분석한 사료"],
    sourcing:[
      ["누가","크로머 백작(1841~1917). 1883년부터 1907년까지 이집트 주재 영국 총영사로, 사실상 이집트를 통치했다."],
      ["언제","1908년. 총영사에서 물러난 이듬해에 출간"],
      ["왜","자신의 이집트 통치를 기록하고 정당화하려는 성격이 강한 책으로 평가된다."],
      ["어디에 인용되나","사이드, 『오리엔탈리즘』(1978) 1장"]
    ],
    orig:"Sir Alfred Lyall once said to me: “Accuracy is abhorrent to the Oriental mind. Every Anglo-Indian should always remember that maxim.” Want of accuracy, which easily degenerates into untruthfulness, is in fact the main characteristic of the Oriental mind. The European is a close reasoner; his statements of fact are devoid of any ambiguity; he is a natural logician, albeit he may not have studied logic; he is by nature sceptical and requires proof before he can accept the truth of any proposition; his trained intelligence works like a piece of mechanism. The mind of the Oriental, on the other hand, like his picturesque streets, is eminently wanting in symmetry. His reasoning is of the most slipshod description. … As I am only a diplomatist and an administrator, whose proper study is also man, but from the point of view of governing him, … I content myself with noting the fact that somehow or other the Oriental generally acts, speaks, and thinks in a manner exactly opposite to the European.",
    trHTML:"앨프리드 라이얼 경은 언젠가 내게 말했다. “<mark data-i='0'>정확성은 동양인의 정신이 혐오하는 것</mark>이다. 모든 영국계 인도 관리는 이 격언을 늘 기억해야 한다.” 정확성의 결여는 쉽게 거짓으로 타락하는데, 이것이 사실상 동양인 정신의 주된 특징이다. <mark data-i='1'>유럽인은 치밀하게 추론하는 사람</mark>이다. 그가 사실을 말할 때는 어떤 모호함도 없다. 그는 논리학을 배우지 않았어도 타고난 논리가이다. 그는 본래 회의적이어서, 어떤 명제든 참으로 받아들이기 전에 증거를 요구한다. 그의 훈련된 지성은 기계 장치처럼 움직인다. 반면 <mark data-i='2'>동양인의 정신은 그 그림 같은 거리처럼 균형이 몹시 부족</mark>하다. 그의 추론은 지극히 엉성하다. … 나는 외교관이자 행정가일 뿐이며, 내가 연구하는 것 역시 인간이다. 다만 <mark data-i='3'>그를 통치한다는 관점에서</mark> 연구한다. … 나는 동양인이 어찌 된 일인지 대체로 <mark data-i='4'>유럽인과 정반대로</mark> 행동하고 말하고 생각한다는 사실을 지적하는 데 그치겠다.",
    cites:[

  marks:[
    "<b>남의 말을 빌린 권위.</b> 크로머는 직접 확인한 근거 대신, 인도에서 일한 다른 영국 관리의 ‘격언’을 내세운다. 식민 관료들 사이에서 ‘동양인은 이렇다’는 지식이 돌고 돌며 굳어졌다.",
    "<b>‘유럽인’은 어떻게 정의되나?</b> 치밀함, 논리, 증거, 기계 같은 지성. 모두 근대 과학과 행정이 높이 치는 덕목이다. 유럽인은 스스로를 이 기준의 주인으로 놓는다.",
    "<b>은유의 힘.</b> 구불구불한 거리(풍경)와 정신(사고방식)을 하나로 엮는다. ‘동양’ 전체를 하나의 이미지로 만들어 버리는 수사다.",
    "<b>핵심 문장!</b> 크로머는 인간을 ‘통치한다는 관점에서’ 연구한다고 스스로 밝힌다. 사이드가 강조한 것이 바로 이 <b>지식과 권력의 결합</b>이다.",
    "<b>정반대.</b> 동양인은 유럽인의 ‘반대’로만 정의된다. 이런 <b>이분법</b>에서 동양은 유럽이 자신을 비춰 보는 거울 노릇을 한다."

    done:"표를 다시 보세요. 오른쪽 칸은 왼쪽 칸을 <b>뒤집은 것</b>일 뿐입니다. 크로머의 ‘동양인’은 관찰의 결과라기보다 ‘유럽인’을 돋보이게 하는 <b>반대 그림</b>입니다."

  quiz:{
    q:"사이드의 관점에서, 크로머의 ‘동양인에 대한 지식’이 가진 가장 중요한 특징은?",

    explain:"크로머는 자신이 ‘통치한다는 관점에서’ 인간을 연구한다고 썼습니다. 사이드는 이렇게 <b>‘안다’는 것과 ‘다스린다’는 것이 맞물리는 구조</b>를 오리엔탈리즘의 핵심으로 보았습니다."

  writing:{
    prompt:"<b>맥락화</b>: 크로머가 이집트를 25년 가까이 다스린 뒤 물러나서 이 책을 썼다는 사실을 알면, 이 글을 읽을 때 무엇을 의심하게 되나요? 한두 문장으로 쓰세요.",
    min:30,
    example:"크로머는 이집트를 직접 통치한 당사자이므로, 이 책에는 자신의 통치가 옳았다고 보여 주려는 의도가 담겼을 수 있다. ‘동양인은 부정확하고 비논리적이다’라는 주장은 ‘그래서 영국이 다스려야 했다’는 결론으로 이어지기 쉽다. 따라서 이 글은 이집트인의 실제 모습보다 <b>통치자의 자기 정당화</b>를 보여 주는 사료로 읽어야 한다."

        ["무엇에 의존?","일본·중국 자료와 프랑스 선교사 달레의 『한국천주교회사』 등"]
      ],
      orig:"“In the year 1871, while living at Fukui, in the province of Echizen, Japan, I spent a few days at Tsuruga and Mikuni, …” / “I have borrowed largely from Dallet's ‘Histoire de l'Église de Corée,’ …” (Preface) / “Corea has for centuries successfully carried out the policy of isolation.” … “Corea cannot long remain a hermit nation.” … “The ill fame of the native character for inhospitality and hatred of foreigners belongs not to the people, … It inheres in the government which curses country and people, …” (Chapter I)",
      tr:"“1871년, 일본 에치젠 지방 후쿠이에 살던 때 나는 쓰루가와 미쿠니에서 며칠을 보냈다…” / “나는 달레의 『한국천주교회사』에서 많은 것을 빌려 왔다…” (서문) / “조선은 수 세기 동안 고립 정책을 성공적으로 수행해 왔다.” … “조선은 오래도록 은자의 나라로 남아 있을 수 없다.” … “손님을 박대하고 외국인을 증오한다는 원주민 기질의 악명은 백성의 것이 아니다. … 그것은 나라와 백성을 저주하는 정부에 깃들어 있다…” (제1장)",
      cites:[

function blank(nick){

  ROOMS.forEach(r=>rooms[r.id]={clues:[],checks:{},sort:{},cls:{},quiz:{tries:0,first:null,done:false},w:"",wDone:false,done:false});

function save(){ if(!S||!LS) return; try{LS.setItem(PFX+S.nick,JSON.stringify(S));LS.setItem(PFX+"last",S.nick)}catch(e){} }

function srcCard(src,{trHTML}={}){
  return `<div class="src">
    <div class="hd"><b>📜 사료</b><span>${src.title}</span></div>
    <div class="bd">
      ${(src.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}
      <div class="sourcing">${src.sourcing.map(([k,v])=>`<div><span>${k}</span>${v}</div>`).join("")}</div>
      ${src.img?`<figure style="margin:10px 0;display:flex;gap:10px;align-items:flex-end"><img src="${src.img.src}" alt="${esc(src.img.alt)}" style="width:110px;border-radius:8px;border:1px solid var(--line)" onerror="this.parentNode.classList.add('hide')"><figcaption class="cite" style="margin:0">${esc(src.img.alt)}<br>이미지: <a href="${src.img.credit[1]}" target="_blank" rel="noopener">${esc(src.img.credit[0])}</a> (퍼블릭 도메인)</figcaption></figure>`:''}
      ${src.orig?`<details style="margin:10px 0"><summary class="mute small" style="cursor:pointer">영어 원문 보기</summary><p class="orig" style="margin-top:8px">${esc(src.orig)}</p></details>`:''}
      ${trHTML?`<div class="clue" style="margin:8px 0">🔍 <b>아래 번역문에서 노란 점선 밑줄 5곳을 모두 눌러 단서를 모으세요.</b> 5개를 모두 찾아야 퀴즈가 열립니다.</div><p class="tr" id="tr">${trHTML}</p><div class="mute small">※ 한국어는 수업용 번역입니다.</div>`:''}
      ${src.tr?`<p class="tr">${src.tr}</p><div class="mute small">※ 한국어는 수업용 번역입니다.</div>`:''}
      ${src.summary?`<ul class="tr" style="padding-left:20px">${src.summary.map(x=>`<li>${x}</li>`).join("")}</ul>`:''}
      ${src.extra?`<div class="clue">${src.extra}</div>`:''}
      ${src.note?`<div class="mute small">※ ${src.note}</div>`:''}
      ${citeList(src.cites)}
    </div></div>`;
}
function stepHead(n,t,on=true){return `<div class="step"><span class="n ${on?'':'off'}">${n}</span><h3>${t}</h3></div>`}

function room(i){
  const r=ROOMS[i], st=S.rooms[r.id];
  renderTop(); goTop();
  let h=`<div class="row" style="margin-top:6px"><button class="btn ghost small" id="back">← 복도로</button><span class="chip">ROOM ${r.no} · ${r.sub}</span></div>
  <h1 style="font-size:clamp(26px,4vw,36px)">${r.title}</h1>
  <p class="story">${r.story}</p>`;
  let n=1;
  if(r.id==="r1"){
    h+=stepHead(n++,"그림 속 단서 4개 찾기");
    h+=`<div class="figure" id="fig"><img src="${r.img.src}" alt="${esc(r.img.alt)}" id="figImg">
        ${r.hotspots.map((p,k)=>`<button class="hot ${st.clues.includes(k)?'found':''}" data-k="${k}" style="left:${p.x}%;top:${p.y}%" aria-label="${p.label}">${st.clues.includes(k)?'✓':k+1}</button>`).join("")}
      </div>
      <div class="cite" style="margin-top:4px">이미지: <a href="${r.img.credit[1]}" target="_blank" rel="noopener">${esc(r.img.credit[0])}</a> (퍼블릭 도메인)</div>
      <div class="row small mute" style="margin-top:6px" id="hotAlt"><span>단서 목록:</span>${r.hotspots.map((p,k)=>`<button class="btn ghost small" data-k="${k}">${k+1}. ${p.label}</button>`).join("")}</div>
      <div id="clues"></div>`;
    h+=srcCard(r.source);
    h+=`<div id="afterBox" class="${st.clues.length>=4?'':'hide'}"><div class="clue">${r.after}${citeList(r.afterCites)}</div></div>`;
  }
  if(r.id==="r2"){
    h+=stepHead(n++,"출처 확인과 단서 5개 찾기");
    h+=srcCard(r.source,{trHTML:r.source.trHTML});
    h+=`<div id="clues"></div>`;
    h+=stepHead(n++,"이분법 분류하기");
    h+=`<div id="sort"></div>`;
  }
  if(r.id==="r3"){
    h+=stepHead(n++,"두 사료 읽기");
    h+=`<div class="two">${r.sources.map(s=>srcCard(s)).join("")}</div>`;
    h+=stepHead(n++,"출처 확인: 참일까, 거짓일까?");
    h+=`<div id="checks"></div>`;
  }
  if(r.id==="r4"){
    h+=stepHead(n++,"사료 읽기");
    h+=srcCard(r.source);
    h+=`<div class="clue">${r.after}</div>`;
    h+=stepHead(n++,"같은 설계도 찾기");
    h+=`<div id="sort"></div>`;
  }
  if(r.id==="r5"){
    h+=stepHead(n++,"사례 읽기");
    h+=srcCard(r.source);
    h+=stepHead(n++,"판정하기");
    h+=`<div id="cls"></div>`;
  }
  h+=stepHead(n++,"🔒 잠금 퀴즈");
  h+=`<div class="panel" id="quiz"></div>`;
  if(r.writing){ h+=stepHead(n++,"✍ 서술형"); h+=`<div class="panel" id="wr"></div>`; }
  h+=`<div id="unlock"></div>`;
  app.innerHTML=h;
  $("#back").onclick=hall;

  /* --- r1 hotspots --- */
  if(r.id==="r1"){
    const showClues=()=>{ $("#clues").innerHTML=st.clues.slice().sort().map(k=>`<div class="clue"><b>${r.hotspots[k].title}</b><br>${r.hotspots[k].text}</div>`).join("")
      + `<div class="mute small" style="margin-top:6px">찾은 단서 ${st.clues.length} / 4</div>`; };
    const hit=k=>{ if(!st.clues.includes(k)){st.clues.push(k);save();}
      app.querySelectorAll(`.hot[data-k="${k}"]`).forEach(b=>{b.classList.add("found");b.textContent="✓"});
      showClues(); if(st.clues.length>=4){$("#afterBox").classList.remove("hide");} gate(); };
    app.querySelectorAll(".hot,#hotAlt button").forEach(b=>b.onclick=()=>hit(+b.dataset.k));
    const img=$("#figImg");
    const fail=()=>{ $("#fig").innerHTML=`<div class="ph"><div style="font-size:40px">🖼</div><div><b>${esc(r.img.alt)}</b></div><div class="small">이미지를 불러오지 못했습니다. 아래 단서 버튼을 눌러 진행하세요.<br><a href="https://en.wikipedia.org/wiki/Women_of_Algiers" target="_blank" rel="noopener">그림 보기(위키백과)</a></div></div>`; };
    img.onerror=fail; if(img.complete&&img.naturalWidth===0) fail();
    showClues();
  }
  /* --- r2 marks --- */
  if(r.id==="r2"){
    const need=r.marks.length;
    const show=()=>{ $("#clues").innerHTML=(st.clues.slice().sort().map(k=>`<div class="clue">${r.marks[k]}</div>`).join(""))+`<div class="mute small" style="margin-top:6px">찾은 단서 ${st.clues.length} / ${need}</div>`; };
    app.querySelectorAll("#tr mark").forEach(m=>{const k=+m.dataset.i; if(st.clues.includes(k)) m.classList.add("found");
      m.onclick=()=>{ if(!st.clues.includes(k)){st.clues.push(k);save()} m.classList.add("found"); show(); gate(); }});
    show(); sortWidget($("#sort"),r.sort,st,gate);
  }
  if(r.id==="r3"){ checksWidget($("#checks"),r.checks,st,gate); }
  if(r.id==="r4"){ sortWidget($("#sort"),r.sort,st,gate); }
  if(r.id==="r5"){ classifyWidget($("#cls"),r.classify,st,gate); }

  quizWidget($("#quiz"),r.quiz,st,gate);
  if(r.writing) writingWidget($("#wr"),r.writing,st,gate);

  function missing(){
    const m=[], n=o=>Object.keys(o).length;
    if(r.id==="r1"&&st.clues.length<4) m.push(["#fig",`그림 속 단서 찾기: ${st.clues.length}/4 (번호 버튼이나 단서 목록을 누르세요)`]);
    if(r.id==="r2"){
      if(st.clues.length<r.marks.length) m.push(["#tr",`번역문 속 밑줄 단서 찾기: ${st.clues.length}/${r.marks.length} (노란 점선 밑줄을 누르세요)`]);
      if(n(st.sort)<r.sort.items.length) m.push(["#sort",`이분법 분류: ${n(st.sort)}/${r.sort.items.length}`]);
    }
    if(r.id==="r3"&&n(st.checks)<r.checks.length) m.push(["#checks",`참/거짓 판단: ${n(st.checks)}/${r.checks.length}`]);
    if(r.id==="r4"&&n(st.sort)<r.sort.items.length) m.push(["#sort",`같은 설계도 분류: ${n(st.sort)}/${r.sort.items.length}`]);
    if(r.id==="r5"&&n(st.cls)<r.classify.items.length) m.push(["#cls",`사례 판정: ${n(st.cls)}/${r.classify.items.length}`]);
    return m;
  }
  function ready(){ return missing().length===0; }
  function gate(){
    const q=$("#quiz");
    q.classList.toggle("locked",!ready());
    q.querySelectorAll(".opt").forEach(b=>{ if(!st.quiz.done) b.disabled=!ready(); });
    const msg=q.querySelector(".lockmsg");
    if(msg){ const ms=missing(); msg.classList.toggle("hide",!ms.length);
      msg.innerHTML=ms.length?`🔒 아직 남은 활동이 있습니다:`+ms.map(([sel,t])=>`<button class="btn ghost small" style="display:flex;margin-top:6px" data-go="${sel}">↑ ${t}</button>`).join(""):"";
      msg.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const t=document.querySelector(b.dataset.go); if(t) t.scrollIntoView({behavior:"smooth",block:"center"});}); }
    const ok=st.quiz.done && (!r.writing||st.wDone);
    if(ok && !st.done){ st.done=true; save(); renderTop(); }
    $("#unlock").innerHTML = st.done ? `<div class="unlock"><div class="big">🔑</div><h2 style="margin:.2em 0">열쇠 획득: <span class="y">${r.key}</span></h2>
      <p class="mute">${i<ROOMS.length-1?'다음 방의 문이 열렸습니다.':'다섯 개의 열쇠가 모두 모였습니다. 출구로 가세요!'}</p>
      <div class="row" style="justify-content:center">${i<ROOMS.length-1?`<button class="btn" id="nextRoom">${ROOMS[i+1].no}번 방으로 →</button>`:`<button class="btn" id="toExit">출구로 →</button>`}<button class="btn ghost" id="toHall">복도로</button></div></div>`:"";
    if(st.done){ const nb=$("#nextRoom"); if(nb) nb.onclick=()=>room(i+1); const te=$("#toExit"); if(te) te.onclick=exitRoom; $("#toHall").onclick=hall; }
  }
  gate();
}

/* --- 위젯: 퀴즈 --- */
function quizWidget(el,q,st,cb){
  const render=()=>{
    el.innerHTML=`<p style="margin-top:0"><b>${q.q}</b></p>
      <div class="fb no lockmsg"></div>
      <div class="opts">${q.opts.map((o,k)=>`<button class="opt ${st.quiz.done&&k===q.a?'ok':''}" data-k="${k}" ${st.quiz.done?'disabled':''}>${String.fromCharCode(9312+k)} ${o}</button>`).join("")}</div>
      <div id="qfb">${st.quiz.done?`<div class="fb ok">✅ 정답! ${q.explain}</div>`:''}</div>`;
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k; st.quiz.tries++;
      if(k===q.a){ if(st.quiz.first===null) st.quiz.first=true; st.quiz.done=true; save(); render(); cb(); toast("🔓 잠금 해제!"); }
      else{ if(st.quiz.first===null) st.quiz.first=false; save(); b.classList.add("no","shake"); b.disabled=true;
        el.querySelector("#qfb").innerHTML=`<div class="fb no">❌ 다시 생각해 보세요. <b>힌트</b>: ${q.hint}</div>`; }
    });
    cb && setTimeout(cb,0);
  };
  render();
}
/* --- 위젯: 서술형 --- */
function writingWidget(el,w,st,cb){
  const render=()=>{
    el.innerHTML=`<p style="margin-top:0">${w.prompt}</p>
      <textarea id="wta" placeholder="여기에 쓰세요" ${st.wDone?'readonly':''}>${esc(st.w)}</textarea>
      <div class="count" id="wc"></div>
      <div class="row"><button class="btn" id="wsub" ${st.wDone?'disabled':''}>${st.wDone?'제출 완료':'제출하고 예시 답안 보기'}</button>${st.wDone?'<button class="btn ghost small" id="wedit">고쳐 쓰기</button>':''}</div>
      ${st.wDone?`<div class="example"><b>예시 답안</b><br>${w.example}<div class="mute small" style="margin-top:8px">예시 답안은 하나의 모범일 뿐 정답이 아닙니다. 내 답과 비교해 근거가 충분한지 점검해 보세요.</div></div>`:''}`;
    const ta=el.querySelector("#wta"), wc=el.querySelector("#wc"), sb=el.querySelector("#wsub");
    const upd=()=>{const L=ta.value.trim().length; wc.textContent=`${L}자 / 최소 ${w.min}자`; if(!st.wDone) sb.disabled=L<w.min;};
    ta.oninput=()=>{st.w=ta.value;save();upd()}; upd();
    sb.onclick=()=>{ if(ta.value.trim().length<w.min) return; st.w=ta.value; st.wDone=true; save(); render(); cb(); };
    const ed=el.querySelector("#wedit"); if(ed) ed.onclick=()=>{ st.wDone=false; save(); render(); };
  };
  render();
}
/* --- 위젯: 분류(정답 있음) --- */
function sortWidget(el,cfg,st,cb){
  let sel=null;
  const render=()=>{
    const pool=cfg.items.map((it,k)=>[it,k]).filter(([it,k])=>st.sort[k]===undefined);
    el.innerHTML=`<p class="small" style="margin-top:0">${cfg.prompt}</p>
      <div class="sort"><div class="pool">${pool.length?pool.map(([it,k])=>`<button class="card ${sel===k?'sel':''}" data-k="${k}">${esc(it[0])}</button>`).join(""):'<span class="mute small">모든 카드를 옮겼습니다.</span>'}</div>
      <div class="bins">${cfg.bins.map((b,bi)=>`<div class="bin ${sel!==null?'target':''}" data-b="${bi}"><h4>${b}</h4>${cfg.items.map((it,k)=>st.sort[k]===bi?`<span class="card placed">${esc(it[0])}</span>`:'').join("")}</div>`).join("")}</div></div>
      <div id="sfb">${pool.length===0?`<div class="fb ok">${cfg.done}</div>`:''}</div>`;
    el.querySelectorAll(".pool .card").forEach(c=>c.onclick=()=>{sel=+c.dataset.k;render()});
    el.querySelectorAll(".bin").forEach(b=>b.onclick=()=>{
      if(sel===null) return; const bi=+b.dataset.b;
      if(cfg.items[sel][1]===bi){ st.sort[sel]=bi; sel=null; save(); render(); cb(); }
      else{ b.classList.add("shake"); el.querySelector("#sfb").innerHTML=`<div class="fb no">그 칸이 아닙니다. 사료의 표현을 다시 확인해 보세요.</div>`; setTimeout(()=>b.classList.remove("shake"),400); }
    });
  };
  render();
}
/* --- 위젯: 참/거짓 --- */
function checksWidget(el,items,st,cb){
  const render=()=>{
    el.innerHTML=items.map((it,k)=>{const done=st.checks[k]!==undefined;
      return `<div class="panel"><div>${k+1}. ${it.s}</div>
        <div class="row" style="margin-top:8px">${done?'':`<button class="btn ghost small" data-k="${k}" data-v="1">참</button><button class="btn ghost small" data-k="${k}" data-v="0">거짓</button>`}</div>
        <div id="cf${k}">${done?`<div class="fb ok">✅ ${it.a?'참':'거짓'}. ${it.fb}</div>`:''}</div></div>`}).join("");
    el.querySelectorAll("button[data-k]").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, v=b.dataset.v==="1";
      if(v===items[k].a){ st.checks[k]=true; save(); render(); cb(); }
      else{ b.classList.add("shake"); b.disabled=true; $("#cf"+k).innerHTML=`<div class="fb no">다시 확인해 보세요. 사료 카드의 ‘누가/조선 방문?/무엇에 의존?’ 칸과 원문을 살펴보세요.</div>`; }
    });
  };
  render();
}
/* --- 위젯: 판정(열린 답) --- */
function classifyWidget(el,cfg,st,cb){
  const render=()=>{
    el.innerHTML=`<p class="small" style="margin-top:0">${cfg.prompt}</p>`+cfg.items.map((it,k)=>{const v=st.cls[k];
      return `<div class="panel"><div><b>사례 ${k+1}.</b> ${it.s}</div>
      <div class="row" style="margin-top:8px">${cfg.choices.map((c,ci)=>`<button class="btn ${v===ci?'':'ghost'} small" data-k="${k}" data-c="${ci}">${c}</button>`).join("")}</div>
      ${v!==undefined?`<div class="fb info">내 판정: <b>${cfg.choices[v]}</b><br>${it.fb}</div>`:''}</div>`}).join("");
    el.querySelectorAll("button[data-k]").forEach(b=>b.onclick=()=>{ st.cls[+b.dataset.k]=+b.dataset.c; save(); render(); cb(); });
  };
  render();
}

    <textarea id="fta" style="min-height:220px" placeholder="사료를 먼저 고르고 쓰세요" ${f.done?'readonly':''}>${esc(f.text)}</textarea>

    <div class="row"><button class="btn" id="fsub">${f.done?'제출 완료':'제출하고 탈출하기'}</button>${f.done?'<button class="btn ghost small" id="fedit">고쳐 쓰기</button>':''}</div>

  $("#back").onclick=hall;
  app.querySelectorAll("#srcPick button").forEach(b=>b.onclick=()=>{f.src=b.dataset.id;save();exitRoom();setTimeout(()=>{const el=$("#srcInfo");if(el) el.scrollIntoView({behavior:"smooth",block:"start"})},50)});
  const ta=$("#fta"),fc=$("#fc"),sb=$("#fsub");
  const upd=()=>{const L=ta.value.trim().length;fc.textContent=`${L}자 / 최소 ${FINAL.min}자`; if(!f.done) sb.disabled=!(L>=FINAL.min&&f.src)};
  ta.oninput=()=>{f.text=ta.value;save();upd()}; upd(); if(f.done) sb.disabled=true;
  sb.onclick=()=>{ if(f.done) return; f.text=ta.value; f.done=true; S.end=S.end||Date.now(); save(); exitRoom(); setTimeout(()=>$("#result").scrollIntoView({behavior:"smooth"}),50) };
  const ed=$("#fedit"); if(ed) ed.onclick=()=>{f.done=false;save();exitRoom()};
  if(f.done) showResult();

function finalSourceInfo(id){
  const R=k=>ROOMS.find(r=>r.id===k);
  let src, figure="", clues="", extra="", roomName="";
  const strip=h=>h.replace(/<mark[^>]*>/g,"<b>").replace(/<\/mark>/g,"</b>");
  if(id==="r1"){ const r=R("r1"); src=r.source; roomName=r.title;
    figure=`<div class="figure" style="margin-bottom:10px"><img src="${r.img.src}" alt="${esc(r.img.alt)}" onerror="this.parentNode.classList.add('hide')"></div><div class="cite" style="margin:-4px 0 10px">이미지: <a href="${r.img.credit[1]}" target="_blank" rel="noopener">${esc(r.img.credit[0])}</a> (퍼블릭 도메인)</div>`;
    clues=r.hotspots.map(h=>`<div class="clue"><b>${h.title}</b><br>${h.text}</div>`).join("");
    extra=`<div class="clue">${r.after}${citeList(r.afterCites)}</div>`; }
  if(id==="r2"){ const r=R("r2"); roomName=r.title; src=Object.assign({},r.source,{tr:strip(r.source.trHTML)});
    clues=r.marks.map(m=>`<div class="clue">${m}</div>`).join("")+`<div class="clue"><b>이분법 분류 정리</b><br>${r.sort.done}</div>`; }
  if(id==="r3a"||id==="r3b"){ const r=R("r3"); roomName=r.title; src=r.sources[id==="r3a"?0:1];
    clues=r.checks.map(c=>`<div class="clue"><b>${c.a?'참':'거짓'}</b> · ${c.s}<br><span class="mute">${c.fb}</span></div>`).join(""); }
  if(id==="r4"){ const r=R("r4"); roomName=r.title; src=r.source;
    extra=`<div class="clue">${r.after}</div>`; clues=`<div class="clue"><b>같은 설계도 정리</b><br>${r.sort.done}</div>`; }
  if(id==="r5"){ const r=R("r5"); roomName=r.title; src=r.source;
    clues=r.classify.items.map((it,k)=>`<div class="clue"><b>사례 ${k+1}.</b> ${it.s}<br><span class="mute">${it.fb}</span></div>`).join(""); }
  if(!src) return "";
  return `<div class="panel" style="margin-top:14px;border-color:var(--ydim)">
    <div class="row" style="justify-content:space-between"><h3 style="margin:0">📂 사료 다시 보기</h3><span class="chip">${roomName}에서 본 사료</span></div>
    <div style="margin-top:12px">${figure}${srcCard(src)}</div>
    ${extra}
    <details style="margin-top:12px"><summary style="cursor:pointer;color:var(--y);font-weight:700">🔍 이 방에서 찾은 단서와 정리 보기</summary>${clues}</details>
  </div>`;
}
function makeCode(){
  const o={v:1,n:S.nick,s:S.start,e:S.end,q:{},w:{},c:{},f:{s:S.final.src,t:S.final.text}};
  ROOMS.forEach(r=>{const st=S.rooms[r.id]; o.q[r.id]=[st.quiz.first?1:0,st.quiz.tries]; if(r.writing) o.w[r.id]=st.w; });
  o.c.r5=ROOMS[4].classify.items.map((_,k)=>S.rooms.r5.cls[k]??-1);
  const bytes=new TextEncoder().encode(JSON.stringify(o)); let bin=""; bytes.forEach(b=>bin+=String.fromCharCode(b));
  return "OE1-"+btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

function glossary(){
  goTop();
  app.innerHTML=`<div class="row" style="margin-top:6px"><button class="btn ghost small" id="back">← 돌아가기</button></div>
  <h1 style="font-size:clamp(26px,4vw,36px)">📖 용어 사전</h1>
  <div class="panel"><dl class="gl">${GLOSSARY.map(([t,d])=>`<dt>${t}</dt><dd>${d}</dd>`).join("")}</dl>
  <p class="mute small">※ 수업용으로 풀어 쓴 설명입니다. 정확한 개념은 사이드의 『오리엔탈리즘』(박홍규 옮김, 교보문고) 서설을 함께 읽으세요.</p></div>`;
  $("#back").onclick=()=>S?hall():intro();
}

/* =====================================================================
   화면: 교사용
   ===================================================================== */
function decode(code){
  try{ let b=code.slice(4).replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4) b+="=";
    const bin=atob(b); const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0)); return JSON.parse(new TextDecoder().decode(bytes)); }catch(e){return null}
}
let TROWS=[];
function teacher(){
  S=null; renderTop(); goTop();
  app.innerHTML=`<div class="row" style="margin-top:6px"><button class="btn ghost small" id="back">← 학생 화면</button><span class="chip">교사용</span></div>
  <h1 style="font-size:clamp(26px,4vw,36px)">교사용 결과 모아보기</h1>
  <div class="panel"><p style="margin-top:0" class="small">학생들이 제출한 결과 코드를 아래 칸에 <b>한꺼번에</b> 붙여 넣으세요. 구글 클래스룸 댓글을 통째로 복사해도 됩니다. <b>OE1-</b>로 시작하는 코드만 자동으로 찾아냅니다. 붙여 넣은 내용은 이 브라우저 밖으로 전송되지 않습니다.</p>
  <textarea id="paste" style="min-height:160px" placeholder="OE1-..."></textarea>
  <div class="row" style="margin-top:10px"><button class="btn" id="parse">결과 보기</button><button class="btn ghost" id="tsv" disabled>📋 표 복사(구글 시트에 붙여넣기용)</button></div></div>
  <div id="tout"></div>
  <h2>교사용 사료 출처 목록</h2>
  <div class="panel small">${ROOMS.map(r=>{const srcs=r.sources||[r.source];return `<p style="margin:.4em 0"><b class="y">${r.no}. ${r.title}</b><br>${srcs.map(s=>s.title+citeList(s.cites)).join("<br>")}${r.afterCites?citeList(r.afterCites):''}</p>`}).join("")}
  <p class="mute">※ 영어 사료의 한국어 번역은 수업용 번역(제작자 번역)입니다. 다카하시 『조선인』은 원문 대신 연구 문헌과 번역본 소개 기사에 근거한 요약입니다.</p></div>`;
  $("#back").onclick=()=>{history.replaceState(null,"",location.pathname);intro()};
  $("#parse").onclick=()=>{
    const codes=($("#paste").value.match(/OE1-[A-Za-z0-9_-]+/g)||[]);
    const map=new Map(); codes.forEach(c=>{const d=decode(c); if(d) map.set(d.n+"|"+d.s,d)});
    TROWS=[...map.values()].sort((a,b)=>a.n.localeCompare(b.n,"ko"));
    renderTRows(codes.length);
  };
  $("#tsv").onclick=async()=>{
    const head=["닉네임","소요(분)",...ROOMS.map(r=>r.no+"번방 첫시도정답"),...ROOMS.map(r=>r.no+"번방 시도횟수"),"2번방 서술","3번방 서술","5번방 서술","최종 사료","최종 해설문"];
    const clean=s=>String(s||"").replace(/[\t\r\n]+/g," ");
    const lines=[head.join("\t"),...TROWS.map(d=>[d.n,d.e?Math.round((d.e-d.s)/60000):"",...ROOMS.map(r=>d.q[r.id]?.[0]?"O":"X"),...ROOMS.map(r=>d.q[r.id]?.[1]??""),clean(d.w.r2),clean(d.w.r3),clean(d.w.r5),(FINAL_SOURCES.find(x=>x[0]===d.f.s)||["",""])[1],clean(d.f.t)].join("\t"))];
    try{await navigator.clipboard.writeText(lines.join("\n"));toast("복사했습니다. 구글 시트 A1에 붙여 넣으세요.")}catch(e){toast("복사가 막혀 있습니다. 브라우저 설정을 확인하세요.")}
  };
}
function renderTRows(found){
  const out=$("#tout"); $("#tsv").disabled=!TROWS.length;
  if(!TROWS.length){out.innerHTML=`<div class="fb no">${found?'코드를 해석하지 못했습니다. 코드가 잘리지 않았는지 확인하세요.':'OE1-로 시작하는 코드를 찾지 못했습니다.'}</div>`;return}
  const N=TROWS.length;
  const rate=ROOMS.map(r=>Math.round(100*TROWS.filter(d=>d.q[r.id]?.[0]).length/N));
  out.innerHTML=`<h2>요약 (${N}명)</h2>
  <div class="panel"><div class="small mute">방별 잠금 퀴즈 ‘한 번에 정답’ 비율 (낮을수록 수업에서 다시 다룰 지점)</div>
  ${ROOMS.map((r,i)=>`<div style="margin-top:8px"><div class="row small" style="justify-content:space-between"><span>${r.no}. ${r.title}</span><b class="y">${rate[i]}%</b></div><div class="progress"><i style="width:${rate[i]}%"></i></div></div>`).join("")}
  <div class="small mute" style="margin-top:12px">5번 방 판정 분포</div>
  ${ROOMS[4].classify.items.map((it,k)=>{const cnt=ROOMS[4].classify.choices.map((_,ci)=>TROWS.filter(d=>d.c?.r5?.[k]===ci).length);return `<div class="small" style="margin-top:4px">사례 ${k+1}: ${ROOMS[4].classify.choices.map((c,ci)=>`${c} <b>${cnt[ci]}</b>`).join(" · ")}</div>`}).join("")}
  </div>
  <h2>학생별 결과</h2>
  <div class="panel" style="overflow-x:auto"><table><thead><tr><th>닉네임</th><th>소요</th>${ROOMS.map(r=>`<th>${r.no}번</th>`).join("")}<th>최종 사료</th><th></th></tr></thead>
  <tbody>${TROWS.map((d,i)=>`<tr><td><b>${esc(d.n)}</b></td><td>${d.e?Math.round((d.e-d.s)/60000)+'분':'-'}</td>${ROOMS.map(r=>{const q=d.q[r.id]||[0,0];return `<td>${q[0]?'<span class="dot" style="background:var(--ok)"></span>':'<span class="dot" style="background:var(--bad)"></span>'}${q[1]}회</td>`}).join("")}<td class="small">${esc((FINAL_SOURCES.find(x=>x[0]===d.f.s)||["","-"])[1])}</td><td><button class="btn ghost small" data-i="${i}">답안 보기</button></td></tr>
  <tr class="hide" id="det${i}"><td colspan="${ROOMS.length+4}"><div class="small">
    <p><b class="y">2번 방(맥락화)</b><br>${esc(d.w.r2||'-')}</p><p><b class="y">3번 방(비교)</b><br>${esc(d.w.r3||'-')}</p><p><b class="y">5번 방(적용)</b><br>${esc(d.w.r5||'-')}</p><p><b class="y">최종 해설문</b> (${esc((FINAL_SOURCES.find(x=>x[0]===d.f.s)||["","-"])[1])})<br>${esc(d.f.t||'-')}</p></div></td></tr>`).join("")}</tbody></table>
  <div class="small mute" style="margin-top:8px">● 초록: 잠금 퀴즈 한 번에 정답 / ● 빨강: 오답 후 통과 · 숫자는 시도 횟수</div></div>`;
  out.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>$("#det"+b.dataset.i).classList.toggle("hide"));
}

/* =====================================================================
   시작
   ===================================================================== */
function boot(){ if(location.hash==="#teacher") teacher(); else intro(); }
window.addEventListener("hashchange",()=>{ if(location.hash==="#teacher") teacher(); });
boot();
</script>
</body>
</html>
